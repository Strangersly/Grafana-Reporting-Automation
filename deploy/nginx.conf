limit_req_zone $binary_remote_addr zone=grafana_login:10m rate=10r/m;

upstream grafana_reporter {
    server unix:/run/grafana-reporter/web.sock;
}

server {
    listen 80;
    server_name reports.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name reports.example.com;

    ssl_certificate /etc/letsencrypt/live/reports.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/reports.example.com/privkey.pem;
    client_max_body_size 6m;

    location = /login/ {
        limit_req zone=grafana_login burst=5 nodelay;
        proxy_pass http://grafana_reporter;
        include proxy_params;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /static/ {
        alias /srv/grafana-reporter/staticfiles/;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    location /protected-reports/ {
        internal;
        alias /srv/grafana-reporter/reports/;
        add_header X-Content-Type-Options nosniff;
    }

    location / {
        proxy_pass http://grafana_reporter;
        include proxy_params;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }
}
