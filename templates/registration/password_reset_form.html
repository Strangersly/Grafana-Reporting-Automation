{% extends "base.html" %}
{% block title %}Reset password{% endblock %}
{% block content %}
<section class="auth-panel"><h1>Reset password</h1><form method="post" class="stack-form">{% csrf_token %}{{ form.as_div }}<button class="button primary wide" type="submit">Send reset link</button></form><a class="quiet-link" href="{% url 'login' %}">Back to sign in</a></section>
{% endblock %}
